name: BTS Brazil Show Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bts-show-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Check for Brazilian shows
        env:
          GMAIL_URL: ${{ secrets.GMAIL_URL }}
          GMAIL_APP_PWD: ${{ secrets.GMAIL_APP_PWD }}
          DEST_EMAIL: ${{ secrets.DEST_EMAIL }}
        run: python monitor.py
        
      - name: Save notification state
        run: |
          if [ -f notified.txt ]; then
            git add notified.txt

            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Record show notification"
              git push
            fi
          fi

  
